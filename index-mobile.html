<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4F1FB">
<title>학원 관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20261112t">
<link rel="stylesheet" href="todo-ext.css?v=20261106a">
<link rel="stylesheet" href="m.css?v=20261112t">
</head>
<body class="m-body">
<script>
  // 이 기기에 기억된 테마를 화면을 그리기 전에 먼저 적용 (util.js의 Theme와 같은 키·이름. 서버 값은 동기화 뒤 따라감)
  try { var _t = localStorage.getItem('mg77_theme'); if (/^(light|rose|lavender|cream|apricot|mint|mocha|gray)$/.test(_t || '')) { document.body.classList.add('theme-' + _t); var _m = document.querySelector('meta[name="theme-color"]'), _c = getComputedStyle(document.body).getPropertyValue('--side').trim(); if (_m && _c) _m.setAttribute('content', _c); } } catch (e) {}
</script>

<!-- 로그인 -->
<div id="mg-login" class="login-overlay active">
  <div class="login-box">
    <div class="login-title">학원 관리</div>
    <div class="login-sub">PIN 6자리를 입력하세요</div>
    <input type="password" id="pin-input" class="pin-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <button id="login-btn" class="login-btn" type="button">로그인</button>
    <div id="login-msg" class="login-msg"></div>
  </div>
</div>
<script>
  // 저장된 접속 키가 있으면(자동 로그인) 로그인 화면을 그리기 전에 바로 앱 화면으로 시작한다. (config.js의 LS_AK 'mg77_ak'와 같아야 함)
  try { if (localStorage.getItem('mg77_ak')) { document.getElementById('mg-login').classList.remove('active'); document.body.classList.add('app-on'); } } catch (e) {}
</script>

<!-- 앱 -->
<div id="mg-app">
  <header id="m-head">
    <h1 id="m-title">시간표</h1>
    <button type="button" id="sync-bar" aria-label="지금 동기화"></button>
    <button type="button" id="m-menu" class="kebab" aria-label="메뉴">⋮</button>
  </header>
  <main id="main"></main>
  <nav id="m-tabs" aria-label="화면"></nav>
</div>

<datalist id="dl-schools"></datalist>
<div id="toast" class="toast"></div>

<script src="config.js?v=20261105a"></script>
<script src="util.js?v=20261112t"></script>
<script src="store.js?v=20261112t"></script>
<script src="calendar.js?v=20261112t"></script>
<script src="students.js?v=20261110b"></script>
<script src="classes.js?v=20261110a"></script>
<script src="lessons.js?v=20261112t"></script>
<script src="todo-ext.js?v=20261112a"></script>
<script src="exams.js?v=20261112t"></script>
<script src="sms.js?v=20261112t"></script>
<script src="m-app.js?v=20261112a"></script>
</body>
</html>
