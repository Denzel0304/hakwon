<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학원 관리</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=20261031b">
</head>
<body>

<!-- 로그인 -->
<div id="mg-login" class="login-overlay active">
  <div class="login-box">
    <div class="login-title">학원 관리</div>
    <div class="login-sub">PIN 6자리를 입력하세요</div>
    <input type="password" id="pin-input" class="pin-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
    <button id="login-btn" class="login-btn" type="button">로그인</button>
    <div id="login-msg" class="login-msg"></div>
  </div>
</div>

<!-- 앱 -->
<div id="mg-app">
  <aside id="side">
    <div id="mini-cal"></div>
    <nav id="nav">
      <button data-page="students">학생</button>
      <button data-page="classes">반 관리</button>
      <button data-page="timetable">시간표</button>
      <button data-page="lessons">수업일지</button>
      <button data-page="attendance">출석부</button>
      <button data-page="progress">진도</button>
      <button data-page="makeups">보강</button>
      <button data-page="exams">시험정보</button>
      <button data-page="scores">성적</button>
      <button data-page="counsels">상담</button>
      <button data-page="events">일정</button>
      <button data-page="settings">설정</button>
    </nav>
    <div id="sync-bar"></div>
  </aside>
  <main id="main"></main>
</div>

<datalist id="dl-schools"></datalist>
<div id="toast" class="toast"></div>

<script src="config.js?v=20261031b"></script>
<script src="util.js?v=20261031b"></script>
<script src="store.js?v=20261031b"></script>
<script src="calendar.js?v=20261031b"></script>
<script src="students.js?v=20261031b"></script>
<script src="classes.js?v=20261031b"></script>
<script src="lessons.js?v=20261031b"></script>
<script src="exams.js?v=20261031b"></script>
<script src="misc.js?v=20261031b"></script>
<script src="app.js?v=20261031b"></script>
</body>
</html>
